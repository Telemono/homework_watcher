name: Watch assignments commits

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-assignments
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check for new commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/hunnuOpenSourceSoftware2026/assignments/commits?per_page=10"
          RESPONSE=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API")
          LATEST_SHA=$(echo "$RESPONSE" | jq -r '.[0].sha // empty')
          if [ -z "$LATEST_SHA" ]; then
            echo "Failed to fetch commits:"
            echo "$RESPONSE"
            exit 1
          fi

          STATE_FILE=".github/last-commit.sha"
          if [ ! -f "$STATE_FILE" ]; then
            mkdir -p .github
            echo "$LATEST_SHA" > "$STATE_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$STATE_FILE"
            git commit -m "chore: init last seen commit"
            git push
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_SHA=$(cat "$STATE_FILE")
          if [ "$LATEST_SHA" = "$OLD_SHA" ]; then
            echo "No new commits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$LATEST_SHA" > "$STATE_FILE"
          TSV=$(echo "$RESPONSE" | jq -r --arg old "$OLD_SHA" '
            [ .[] | { sha: .sha,
                       msg: (.commit.message | split("\n")[0]),
                       author: .commit.author.name,
                       date: .commit.author.date,
                       url: .html_url } ] as $all
            | ( $all | map(.sha) | index($old) // -1 ) as $i
            | ( if $i == -1 then $all else $all[($i + 1):] end )
            | .[] | [ .msg, .author, .date, .url ] | @tsv
          ')
          COUNT=$(printf '%s\n' "$TSV" | grep -c . || true)

          {
            echo "assignments 仓库检测到 **${COUNT}** 个新提交："
            echo
            printf '%s\n' "$TSV" | while IFS=$'\t' read -r msg author date url; do
              echo "- **${msg}** —— ${author}（${date}）"
              echo "  ${url}"
            done
          } > "${RUNNER_TEMP}/body.md"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PASSWORD" ]; then
            echo "has_smtp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_smtp=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SERVERCHAN_SENDKEY" ]; then
            echo "has_sendkey=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sendkey=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.has_smtp == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[assignments] 检测到 ${{ steps.check.outputs.count }} 个新提交"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: file:${{ runner.temp }}/body.md

      - name: ServerChan notify
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.has_sendkey == 'true'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          COUNT: ${{ steps.check.outputs.count }}
        run: |
          set -euo pipefail
          curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
            --data-urlencode "title=assignments 有 ${COUNT} 个新提交" \
            --data-urlencode "desp@${RUNNER_TEMP}/body.md"

      - name: Update state
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-commit.sha
          git commit -m "chore: update last seen commit"
          git push
